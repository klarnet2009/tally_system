[env:tally_slave_v2]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; radio_test.cpp defines its own setup()/loop() — must not link with main.cpp
build_src_filter = +<*> -<radio_test.cpp>

; Continuous RX, one binary for every camera: the camera ID lives in NVS and is
; set in the field (BOOT button / serial "id N"). There is no low-power build
; any more — duty-cycle RX was removed with the v4 architecture (irreducible
; deaf window; see documentation/ARCHITECTURE_RF_V4.md §4).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

lib_extra_dirs =
    ../lib

; Standalone rainbow RX test firmware
[env:tally_slave_v2_radiotest]
extends = env:tally_slave_v2
build_src_filter = +<radio_test.cpp>
